[project]
name = "plutus"
version = "0.1.0"
description = "Personal trading platform + autotrader (single-user, self-hosted)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "alpaca-py>=0.44.0",
    "vectorbt>=1.1.0",
    "pandas>=3.0.5",
    "apscheduler>=3.11.3",
    "exchange-calendars>=4.13.2",
    "anthropic>=0.122.0",
    "pyyaml>=6.0.3",
    "plaid-python>=42.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "pandas-stubs>=3.0.5.260730",
    "types-pyyaml>=6.0.12.20260815",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plutus"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/plutus", "tests"]

[[tool.mypy.overrides]]
module = "plutus.migrations.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["vectorbt.*", "exchange_calendars.*", "apscheduler.*", "plaid.*", "plaid"]
ignore_missing_imports = true
